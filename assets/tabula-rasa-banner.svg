<linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5288d8" stop-opacity=".08"/><stop offset=".42" stop-color="#b7c5fb"/><stop offset=".62" stop-color="#bb86f4"/><stop offset="1" stop-color="#a548d8" stop-opacity=".12"/></linearGradient>
<linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4e83e7"/><stop offset=".48" stop-color="#a5aaf4"/><stop offset="1" stop-color="#a84be8"/></linearGradient>

name: Validate charter and benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate references
        run: python scripts/validate.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate synthetic fixture
        run: python scripts/evaluate.py evaluations/fixtures/sample_responses.json
